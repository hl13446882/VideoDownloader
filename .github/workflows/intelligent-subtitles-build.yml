name: Intelligent Subtitles Build

on:
  push:
    branches:
      - feature/intelligent-subtitles
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore desktop app
        run: dotnet restore src/VideoDownloader.UI/VideoDownloader.UI.csproj

      - name: Build desktop app
        run: dotnet build src/VideoDownloader.UI/VideoDownloader.UI.csproj -c Release --no-restore

      - name: Test subtitle infrastructure
        run: dotnet test tests/VideoDownloader.Infrastructure.Tests/VideoDownloader.Infrastructure.Tests.csproj -c Release --filter "FullyQualifiedName~SubtitlePipelineTests"
